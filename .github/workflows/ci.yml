name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.424
      - name: Build and run isolated tests
        shell: pwsh
        run: ./build.ps1 -Action Test
